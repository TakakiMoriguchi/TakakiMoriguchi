<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" fill="none">
  <title>ENTJ - The Commander</title>
  <style>
    text { font-family: 'Share Tech Mono', 'Courier New', monospace; fill: #ff2a2a; }
    .dim { fill: #8a1a1a; }
    .big { font-size: 64px; font-weight: 700; letter-spacing: 12px; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .scan { animation: scan 4s linear infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes scan { from { transform: translateY(0); } to { transform: translateY(240px); } }
  </style>
  <defs>
    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ff2a2a" opacity="0.06"/>
    </pattern>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2a2a" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff2a2a" stop-opacity="0.18"/>
    </linearGradient>
    <clipPath id="frame"><rect width="480" height="240"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="480" height="240" fill="#000"/>
    <rect width="480" height="240" fill="url(#lines)"/>
    <rect class="scan" y="-40" width="480" height="40" fill="url(#beam)"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#ff2a2a" stroke-width="2">
    <path d="M8 28V8h20M452 8h20v20M472 212v20h-20M28 232H8v-20"/>
  </g>

  <text x="24" y="34" font-size="12" class="dim">// 16PERSONALITIES</text>
  <text x="456" y="34" font-size="12" class="dim" text-anchor="end">PERSONALITY TYPE</text>

  <text x="24" y="112" class="big">ENTJ</text>
  <text x="26" y="140" font-size="16" letter-spacing="3">THE COMMANDER<tspan class="cursor">_</tspan></text>

  <line x1="24" y1="160" x2="456" y2="160" stroke="#8a1a1a"/>

  <g font-size="13">
    <text x="24" y="186">E <tspan class="dim">EXTRAVERTED</tspan></text>
    <text x="24" y="210">N <tspan class="dim">INTUITIVE</tspan></text>
    <text x="250" y="186">T <tspan class="dim">THINKING</tspan></text>
    <text x="250" y="210">J <tspan class="dim">JUDGING</tspan></text>
  </g>

  <!-- target reticle -->
  <g stroke="#ff2a2a" stroke-width="1.5" opacity="0.8">
    <circle cx="396" cy="96" r="38"/>
    <circle cx="396" cy="96" r="22" stroke-dasharray="4 4"/>
    <path d="M396 50v20M396 122v20M350 96h20M422 96h20"/>
  </g>
  <circle cx="396" cy="96" r="3" fill="#ff2a2a" class="cursor"/>
</svg>
